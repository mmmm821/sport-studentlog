name: SportLog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and static checks
        run: npm run check

      - name: API and unit tests
        run: npm test

      - name: Start application
        env:
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          PORT: 3000
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Smoke test frontend and API
        run: |
          curl -fsS http://127.0.0.1:3000/ | grep -q "SportLog"
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status"'

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

      - name: Stop application
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
